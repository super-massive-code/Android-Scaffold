config:
  validation: true
  warningsAsErrors: false

style:
  # @Preview functions are entry points for the IDE/screenshot tooling, never called by us.
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ["Preview", "PreviewLightDark"]
  MagicNumber:
    active: true
    ignoreAnnotated: ["Composable"]
    ignoreNumbers: ["-1", "0", "1", "2", "100"]

complexity:
  LongMethod:
    active: true
    threshold: 80
  TooManyFunctions:
    active: true
    thresholdInClasses: 15

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ["Composable"]
